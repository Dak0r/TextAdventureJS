<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>testAdventureJS Editor</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="../textAdventure.js"></script>

    <link rel="stylesheet" href="ext/terminal0.7.2_.min.css" />
    <style>
      :root {
        --global-font-size: 15px;
        --global-line-height: 1.4em;
        --global-space: 10px;
        --font-stack: Menlo, Monaco, Lucida Console, Liberation Mono,
          DejaVu Sans Mono, Bitstream Vera Sans Mono, Courier New, monospace,
          serif;
        --mono-font-stack: Menlo, Monaco, Lucida Console, Liberation Mono,
          DejaVu Sans Mono, Bitstream Vera Sans Mono, Courier New, monospace,
          serif;
        --background-color: #222225;
        --page-width: 90em;
        --font-color: #e8e9ed;
        --invert-font-color: #222225;
        --secondary-color: #a3abba;
        --tertiary-color: #a3abba;
        --primary-color: #62c4ff;
        --error-color: #ff3c74;
        --progress-bar-background: #3f3f44;
        --progress-bar-fill: #62c4ff;
        --code-bg-color: #3f3f44;
        --input-style: solid;
        --display-h1-decoration: none;
      }
    </style>

    <link href="editor-style.css" rel="stylesheet" />
    <link rel="stylesheet" href="../shared/channel-shift.css" />
    <script src="tba_editor.js"></script>
  </head>

  <body>
    <main role="main" class="container">
      <div style="padding: 15px 0 15px 0">
        <h1 class="channel-shift" data-text="textAdventureJS">
          textAdventureJS Game Database Editor
        </h1>
      </div>

      <div id="drop-area">
        <button class="btn btn-primary" id="btn-new">New Project</button>
        <div
          class="file-drop-area"
          id="drop-area-load"
          tabindex="0"
          role="button"
          aria-label="Drop or click to open a project file"
        >
          <p>DRAG & DROP <span class="muted">*.tadb.json</span> HERE</p>
          <p class="hint">or click to browse files</p>
        </div>
      </div>
      <div id="editor-aera">
        <div id="editor-menu">
          <button class="btn btn-error" id="btn-close">Close</button>
          <button class="btn btn-primary" id="btn-save">Save</button>
          <p></p>
          <h2>
            <a
              class="editor-tab"
              href="#"
              id="tabGeneral"
              onclick="onTypeChanged('general')"
              >General</a
            >
            |
            <a
              class="editor-tab"
              href="#"
              id="tabVerbs"
              onclick="onTypeChanged('verbs')"
              >Verbs</a
            >
            |
            <a
              class="editor-tab"
              href="#"
              id="tabObjects"
              onclick="onTypeChanged('objects')"
              >Objects</a
            >
            |
            <a
              class="editor-tab"
              href="#"
              id="tabLocations"
              onclick="onTypeChanged('locations')"
              >Locations</a
            >
            |
            <a
              class="editor-tab"
              href="#"
              id="tabPreview"
              onclick="onTypeChanged('preview')"
              >Debugger</a
            >
          </h2>
        </div>
        <div id="editor">
          <div id="elementSelection"></div>
          <div id="elementEditor"></div>
        </div>
      </div>
    </main>
    <footer>
      <p style="text-align: center">
        by Daniel Korgel -
        <a href="https://github.com/Dak0r/TextAdventureJS"
          >https://github.com/Dak0r/TextAdventureJS</a
        >
      </p>
    </footer>
  </body>
</html>
